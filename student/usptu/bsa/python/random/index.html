 print(\"ID задачи:\", t.id)", "Вопрос 227: Как получить запись по первичному ключу (session.get) или выбрать все записи?\n- Ответ: session.get(Model, id) ищет по первичному ключу, а session.scalars(select(Model)).all() возвращает список всех объектов.\nfrom sqlalchemy import selectwith Session(engine) as session:\n    task = session.get(Task, 1)\n    print(task.title)", "Вопрос 228: Как отфильтровать и отсортировать выборку через .where() и .order_by()?\n- Ответ: Добавить методы .where() и .order_by() к объекту select(Model).\nfrom sqlalchemy import selectwith Session(engine) as session:\n    stmt = select(Task).where(Task.done == False).order_by(Task.id)\n    print(len(session.scalars(stmt).all()))", "Вопрос 229: Как обновить значение поля записи в SQLAlchemy ORM?\n- Ответ: Изменить атрибут полученного объекта Python и вызвать session.commit().\nwith Session(engine) as session:\n    task = session.get(Task, 1)\n    task.done = True\n    session.commit()", "Вопрос 230: Как удалить запись из БД через session.delete()?\n- Ответ: Вызвать session.delete(obj) и подтвердить транзакцию через session.commit().\nwith Session(engine) as session:\n    task = session.get(Task, 1)\n    session.delete(task)\n    session.commit()", "Вопрос 231: Как посчитать количество записей или сумму через func.count() в SQLAlchemy?\n- Ответ: Использовать объект func из модуля sqlalchemy внутри select(func.count(Model.id)).\nfrom sqlalchemy import select, funcwith Session(engine) as session:\n    count = session.scalar(select(func.count(Task.id)))\n    print(\"Количество задач в таблице:\", count)", "Вопрос 232: Как связать две таблицы отношением «Один ко многим» (ForeignKey и relationship)?\n- Ответ: В таблице «многие» создать столбец с ForeignKey, а в обоих классах прописать relationship() с параметром back_populates.\nfrom sqlalchemy import ForeignKeyfrom sqlalchemy.orm import relationshipclass GroupModel(Base):\n    __tablename__ = \"groups\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    students: Mapped[list[\"StudentModel\"]] = relationship(back_populates=\"group\")class StudentModel(Base):\n    __tablename__ = \"students\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    group_id: Mapped[int] = mapped_column(ForeignKey(\"groups.id\"))\n    group: Mapped[\"GroupModel\"] = relationship(back_populates=\"students\")", "Вопрос 233: Что такое связующая таблица для отношения «Многие ко многим» (Many-to-Many)?\n- Ответ: Когда одна запись первой таблицы может относиться ко множеству записей второй и наоборот (например, «Студенты» и «Кружки»), создается промежуточная таблица, хранящая пары внешних ключей (student_id, club_id).\nfrom sqlalchemy import Table, Column, ForeignKeystudent_club = Table(\n    \"student_club\",\n    Base.metadata,\n    Column(\"student_id\", ForeignKey(\"students.id\"), primary_key=True),\n    Column(\"tag_id\", ForeignKey(\"tags.id\"), primary_key=True),)print(\"Связующая таблица:\", student_club.name)", "Вопрос 234: Что такое проблема «N+1 запросов» в ORM и как её решить?\n- Ответ: Выполнение $N$ дополнительных SQL-запросов в цикле при обращении к связанным объектам. Решается предварительной подгрузкой связей через selectinload() или joinedload().\nfrom sqlalchemy import selectfrom sqlalchemy.orm import selectinloadstmt = select(GroupModel).options(selectinload(GroupModel.students))print(stmt)", "Вопрос 235: Зачем в проектах с SQLAlchemy используют инструмент миграций Alembic?\n- Ответ: Alembic позволяет безопасно обновлять структуру уже существующих таблиц в БД (добавлять и переименовывать столбцы) без удаления таблиц и потери данных.\n# Команды терминала:\n# alembic revision --autogenerate -m \"Add column\"\n# alembic upgrade head"];
    const totalQuestions = questions.length;

    function formatText(text) {
        text = text.replace(/^(Вопрос \d+:)(.*?)$/gm, "<strong>$1</strong>$2");

        return text;

    function generateTickets() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';

        // Читаем значения из инпутов
        let minVal = parseInt(document.getElementById('min-q').value) || 1;
        let maxVal = parseInt(document.getElementById('max-q').value) || totalQuestions;

        // Валидация ввода
        if (minVal < 1) minVal = 1;
        if (maxVal > totalQuestions) maxVal = totalQuestions;
        if (minVal >= maxVal) {
            container.innerHTML = '<div class="question-box">Неверный диапазон. Конечный номер должен быть больше начального.</div>';
            return;
        }

        // Индексы в массиве на 1 меньше номера вопроса
        const startIndex = minVal - 1;
        const endIndex = maxVal - 1;
        const rangeSize = endIndex - startIndex + 1;

        if (rangeSize < 2) {
            container.innerHTML = '<div class="question-box">В выбранном диапазоне слишком мало вопросов (нужно хотя бы 2).</div>';
            return;
        }

        // Выбираем 2 уникальных случайных индекса из заданного диапазона
        let indices = new Set();
        while (indices.size < 2) {
            let randIndex = Math.floor(Math.random() * rangeSize) + startIndex;
            indices.add(randIndex);
        }
        
        const selected = Array.from(indices);
        
        selected.forEach((index) => {
            const div = document.createElement('div');
            div.className = 'question-box';
            div.innerHTML = formatText(questions[index]);
            container.appendChild(div);
        });
    }

    // Запускаем генерацию сразу при открытии страницы
    window.onload = generateTickets;
</script>
</body>
</html>
