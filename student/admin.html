<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 500px; margin: auto; }
        select, input[type="text"], input[type="password"], button { width: 100%; padding: 15px; margin-bottom: 15px; font-size: 16px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        .student-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .student-item label { width: 45%; font-weight: bold; font-size: 15px; }
        .student-item select { width: 50%; padding: 10px; margin-bottom: 0; font-size: 14px; }
        button { background-color: #2ea44f; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-red { background-color: #d73a49; width: auto; padding: 10px; font-size: 14px; margin: 0; }
        .settings { background: #f6f8fa; padding: 15px; border-radius: 5px; margin-bottom: 20px; font-size: 14px;}
        #status, #historyStatus { text-align: center; font-weight: bold; margin-top: 10px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #ddd; font-size: 14px; line-height: 1.4; }
        hr { border: 0; height: 1px; background: #ddd; margin: 30px 0; }
    </style>
</head>
<body>

    <div class="settings">
        <label>GitHub Токен:</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxx">
        <button onclick="saveToken()">Сохранить токен</button>
    </div>

    <h2>Отметка работ</h2>
    <select id="groupSelect" onchange="showStudents()">
        <option value="">-- Выберите группу --</option>
        <option value="group1">Группа 101</option>
        <option value="group2">Группа 102</option>
    </select>

    <input type="text" id="labName" placeholder="Название работы (напр. Лаба 1)">
    <div id="studentsList"></div>

    <button onclick="saveData()">Отправить на GitHub</button>
    <div id="status"></div>

    <hr>

    <h2>Управление записями</h2>
    <button onclick="loadHistory()" style="background-color: #0366d6;">Загрузить последние записи</button>
    <div id="historyStatus"></div>
    <div id="historyList"></div>

    <script>
        // === ВАШИ НАСТРОЙКИ ===
        const owner = 'ВАШ_ЛОГИН_GITHUB';
        const repo = 'students-tracker';

        const db = {
            "group1": ["Иванов Иван", "Петров Петр"],
            "group2": ["Алексеев Алексей", "Смирнова Анна"]
        };
        // ======================

        document.getElementById('ghToken').value = localStorage.getItem('ghToken') || '';

        function saveToken() {
            localStorage.setItem('ghToken', document.getElementById('ghToken').value);
            alert('Токен сохранен!');
        }

        function showStudents() {
            const group = document.getElementById('groupSelect').value;
            const list = document.getElementById('studentsList');
            list.innerHTML = '';
            
            if (db[group]) {
                db[group].forEach((name, index) => {
                    list.innerHTML += `
                        <div class="student-item">
                            <label>${name}</label>
                            <select id="status_${index}">
                                <option value="">Не отмечать</option>
                                <option value="Сделал (Вариант А)">Вариант А</option>
                                <option value="Сделал (Вариант Б)">Вариант Б</option>
                                <option value="Был, но не доделал">Был, не доделал</option>
                            </select>
                        </div>
                    `;
                });
            }
        }

        const utf8ToBase64 = (str) => btoa(unescape(encodeURIComponent(str)));
        const base64ToUtf8 = (str) => decodeURIComponent(escape(atob(str)));

        // --- СОХРАНЕНИЕ НОВЫХ ДАННЫХ ---
        async function saveData() {
            const token = localStorage.getItem('ghToken');
            const group = document.getElementById('groupSelect').value;
            const labName = document.getElementById('labName').value;
            
            if (!token) return alert('Введите GitHub токен!');
            if (!group || !labName) return alert('Выберите группу и введите название работы!');

            const selected = [];
            db[group].forEach((name, index) => {
                const status = document.getElementById(`status_${index}`).value;
                if (status !== "") selected.push({ student: name, status: status });
            });

            if (selected.length === 0) return alert('Выберите статус хотя бы для одного студента!');

            const statusEl = document.getElementById('status');
            statusEl.style.color = 'blue';
            statusEl.innerText = 'Сохранение...';

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;

            try {
                let getRes = await fetch(apiUrl, { headers: { 'Authorization': `token ${token}` } });
                if (!getRes.ok) throw new Error('Не удалось прочитать файл data.json');
                let fileData = await getRes.json();
                
                let currentData = JSON.parse(base64ToUtf8(fileData.content));
                const dateStr = new Date().toLocaleDateString('ru-RU');
                
                selected.forEach(item => {
                    currentData.push({ date: dateStr, group: group, student: item.student, lab: labName, status: item.status });
                });

                let putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Отметка: ${group} - ${labName}`,
                        content: utf8ToBase64(JSON.stringify(currentData, null, 2)),
                        sha: fileData.sha
                    })
                });

                if (!putRes.ok) throw new Error('Ошибка при записи на GitHub');

                statusEl.style.color = 'green';
                statusEl.innerText = 'Успешно сохранено!';
                showStudents(); 
                setTimeout(() => { statusEl.innerText = ''; }, 3000);

            } catch (error) {
                statusEl.style.color = 'red';
                statusEl.innerText = error.message;
            }
        }

        // --- ЗАГРУЗКА ИСТОРИИ И УДАЛЕНИЕ ---
        async function loadHistory() {
            const token = localStorage.getItem('ghToken');
            if (!token) return alert('Введите токен!');
            
            const list = document.getElementById('historyList');
            const status = document.getElementById('historyStatus');
            status.style.color = 'blue';
            status.innerText = 'Загрузка...';
            list.innerHTML = '';

            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;
            try {
                // Добавляем timestamp чтобы обойти кэш браузера при загрузке API
                let res = await fetch(apiUrl + '?t=' + Date.now(), { headers: { 'Authorization': `token ${token}` } });
                if (!res.ok) throw new Error('Ошибка загрузки данных');
                let fileData = await res.json();
                let data = JSON.parse(base64ToUtf8(fileData.content));

                status.innerText = '';
                
                if (data.length === 0) {
                    list.innerHTML = '<p>Записей пока нет.</p>';
                    return;
                }

                // Выводим с конца (новые сверху), но привязываем к оригинальному индексу для удаления
                let html = '';
                for (let i = data.length - 1; i >= 0; i--) {
                    let row = data[i];
                    html += `
                        <div class="history-item">
                            <div>
                                <b>${row.date}</b> — ${row.student}<br>
                                <span style="color:#666;">${row.lab} (${row.status})</span>
                            </div>
                            <button class="btn-red" onclick="deleteRecord(${i}, '${fileData.sha}')">Удалить</button>
                        </div>
                    `;
                }
                list.innerHTML = html;

            } catch (error) {
                status.style.color = 'red';
                status.innerText = error.message;
            }
        }

        async function deleteRecord(index, currentSha) {
            if (!confirm('Вы точно хотите удалить эту запись?')) return;

            const token = localStorage.getItem('ghToken');
            const status = document.getElementById('historyStatus');
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/data.json`;
            
            status.style.color = 'blue';
            status.innerText = 'Удаление...';

            try {
                // 1. Сначала всегда запрашиваем свежий файл (вдруг кто-то другой уже изменил его)
                let getRes = await fetch(apiUrl + '?t=' + Date.now(), { headers: { 'Authorization': `token ${token}` } });
                let fileData = await getRes.json();
                let data = JSON.parse(base64ToUtf8(fileData.content));

                // 2. Удаляем нужный элемент по индексу
                data.splice(index, 1);

                // 3. Отправляем обновленный массив обратно
                let putRes = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: `Удалена запись №${index}`,
                        content: utf8ToBase64(JSON.stringify(data, null, 2)),
                        sha: fileData.sha // Обязательно используем самый свежий sha!
                    })
                });

                if (!putRes.ok) throw new Error('Ошибка при удалении');

                status.style.color = 'green';
                status.innerText = 'Запись удалена!';
                
                // Перезагружаем список
                loadHistory();

            } catch (error) {
                status.style.color = 'red';
                status.innerText = error.message;
            }
        }
    </script>
</body>
</html>
