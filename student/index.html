<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История сдачи</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        input[type="text"] { padding: 10px; width: 100%; margin-bottom: 20px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #2ea44f; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .status-ok { color: green; font-weight: bold; }
    </style>
</head>
<body>
    <h2>История сдачи лабораторных работ</h2>
    <input type="text" id="searchInput" placeholder="Поиск по фамилии..." onkeyup="filterTable()">
    
    <table id="labsTable">
        <thead>
            <tr><th>Дата</th><th>Студент</th><th>Работа</th><th>Статус</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        async function loadData() {
            try {
                // Добавляем случайный параметр, чтобы браузер не кэшировал старый JSON
                const response = await fetch('data.json?t=' + Date.now());
                const data = await response.json();
                
                const tbody = document.getElementById('tableBody');
                // Сортируем так, чтобы новые записи были сверху
                data.reverse().forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${row.date}</td>
                        <td>${row.student}</td>
                        <td>${row.lab}</td>
                        <td class="status-ok">Сдано</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4">Ошибка загрузки. Возможно, файл data.json еще не создан.</td></tr>';
            }
        }

        function filterTable() {
            const filter = document.getElementById("searchInput").value.toLowerCase();
            const rows = document.querySelectorAll("#labsTable tbody tr");
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        }

        loadData();
    </script>
</body>
</html>
