<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История сдачи</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        input[type="text"], select { padding: 10px; width: 100%; margin-bottom: 15px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background-color: #2ea44f; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h2>История сдачи лабораторных работ</h2>
    
    <select id="groupFilter" onchange="renderTable()">
        <option value="">-- Все группы --</option>
        <option value="group1">Группа 101</option>
        <option value="group2">Группа 102</option>
    </select>

    <input type="text" id="searchInput" placeholder="Поиск по фамилии..." onkeyup="renderTable()">
    
    <table id="labsTable">
        <thead>
            <tr><th>Дата</th><th>Студент</th><th>Работа</th><th>Статус</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch('data.json?t=' + Date.now());
                allData = await response.json();
                renderTable();
            } catch (error) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="4">Ошибка загрузки. Возможно, файл data.json еще пуст.</td></tr>';
            }
        }

        function renderTable() {
            const groupFilter = document.getElementById("groupFilter").value;
            const textFilter = document.getElementById("searchInput").value.toLowerCase();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Отображаем новые записи сверху
            allData.slice().reverse().forEach(row => {
                if (groupFilter && row.group !== groupFilter) return;
                if (textFilter && !row.student.toLowerCase().includes(textFilter)) return;

                let statusColor = row.status.includes('не доделал') ? 'orange' : 'green';
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.date}</td>
                    <td>${row.student}</td>
                    <td>${row.lab}</td>
                    <td style="color: ${statusColor}; font-weight: bold;">${row.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        loadData();
    </script>
</body>
</html>
